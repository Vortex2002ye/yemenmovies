<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemen Movies Activity</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f1015; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #5865F2; margin-bottom: 10px; }
        p { color: #b9bbbe; font-size: 14px; }
        .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        input { width: 320px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #202225; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #5865F2; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #5865F2; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4752C4; }
        
        .section-title { font-size: 18px; margin-bottom: 15px; color: #dcddde; border-right: 4px solid #5865F2; padding-right: 10px; }
        
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .movie-card { background: #2f3136; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; background: #202225; }
        .movie-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .movie-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #fff; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .watch-btn { display: block; background: #eb459e; color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 5px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .watch-btn:hover { background: #d03588; }
        .loading { text-align: center; color: #8e9297; grid-column: 1 / -1; padding: 30px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Yemen Movies Activity</h1>
        <p>اختر فيلمك أو مسلسلك المفضّل وشاهده مباشرة على موفيز لاند!</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن فيلم (مثل: Avatar, Interstellar)..." onkeydown="if(event.key === 'Enter') searchMovies()">
        <button onclick="searchMovies()">بحث</button>
    </div>

    <div class="section-title" id="sectionTitle">🔥 الأفلام والمسلسلات الرائجة</div>
    
    <div class="movies-grid" id="moviesContainer">
        <div class="loading">جاري جلب الأفلام... ⏳</div>
    </div>

    <script>
        const API_KEY = "b27aae4379d382776f6d3cccdd";

        // جلب الأفلام الرائجة مباشرة عند الفتح
        async function loadTrending() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}&language=ar`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    displayResults(data.results);
                } else {
                    document.getElementById('moviesContainer').innerHTML = `<div class="loading">❌ لم يتم العثور على أفلام حالياً.</div>`;
                }
            } catch (err) {
                document.getElementById('moviesContainer').innerHTML = `<div class="loading">❌ خطأ في الاتصال بقاعدة البيانات.</div>`;
            }
        }

        // وظيفة البحث
        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('moviesContainer');
            
            if (!query) {
                loadTrending();
                return;
            }

            container.innerHTML = `<div class="loading">🔍 جاري البحث عن "${query}"...</div>`;
            
            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=ar`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    document.getElementById('sectionTitle').innerText = `🔎 نتائج البحث عن: "${query}"`;
                    displayResults(data.results);
                } else {
                    container.innerHTML = `<div class="loading">❌ عذراً، لمار نتفوق في العثور على نتائج. جرب كتابة الاسم بالإنجليزي.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="loading">❌ حدث خطأ أثناء البحث.</div>`;
            }
        }

        // عرض النتائج والبوسترات في الشبكة
        function displayResults(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            
            movies.forEach(movie => {
                const title = movie.title || movie.name || "بدون عنوان";
                const poster = movie.poster_path 
                    ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
                    : 'https://via.placeholder.com/160x230?text=No+Image';
                
                // رابط موفيز لاند المباشر
                const movizLink = `https://www.moviz.land/?s=${encodeURIComponent(title)}`;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${poster}" alt="${title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title" title="${title}">${title}</div>
                        <a href="${movizLink}" target="_blank" class="watch-btn">مشاهدة على MovizLand</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تشغيل الجلب التلقائي فور فتح الصفحة
        loadTrending();
    </script>
</body>
</html>
