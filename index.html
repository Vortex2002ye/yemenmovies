<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemen Movies - منصة إيجي ديد</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0c0d12; color: #fff; padding: 20px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .nav-brand { font-size: 22px; font-weight: bold; color: #e50914; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; color: #aaa; }
        .nav-links span { cursor: pointer; transition: 0.2s; }
        .nav-links span:hover, .nav-links span.active { color: #fff; font-weight: bold; }
        
        .search-box { display: flex; gap: 8px; }
        input { width: 250px; padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #181920; color: #fff; font-size: 13px; outline: none; }
        input:focus { border-color: #e50914; }
        button { padding: 9px 18px; border-radius: 6px; border: none; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b20710; }

        /* منطقة المشغل المدمج داخل الموقع */
        .player-container { display: none; background: #181920; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid #333; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .player-info { padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .player-title { font-size: 20px; font-weight: bold; color: #fff; }
        .close-player { background: #333; color: #fff; padding: 6px 15px; border-radius: 5px; cursor: pointer; border: none; font-size: 13px; }
        .close-player:hover { background: #e50914; }

        .section-title { font-size: 18px; margin-bottom: 15px; color: #fff; border-right: 4px solid #e50914; padding-right: 10px; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .movie-card { background: #181920; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; background: #222; }
        .movie-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .movie-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-btn { display: block; background: #e50914; color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 5px; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .play-btn:hover { background: #b20710; }
        .loading { text-align: center; color: #8e9297; grid-column: 1 / -1; padding: 40px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">🎬 Yemen Movies (EgyDead Hub)</div>
        <div class="nav-links">
            <span class="active" onclick="filterCategory('all')">الرئيسية</span>
            <span onclick="filterCategory('movie')">أفلام</span>
            <span onclick="filterCategory('tv')">مسلسلات</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في مكتبة إيجي ديد..." onkeydown="if(event.key === 'Enter') searchMovies()">
            <button onclick="searchMovies()">بحث</button>
        </div>
    </div>

    <!-- مشغل الفيديو المدمج (يظهر عند الضغط على أي عمل) -->
    <div class="player-container" id="playerContainer">
        <div class="video-wrapper">
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
        <div class="player-info">
            <div class="player-title" id="playerTitle">اختر عملاً للمشاهدة</div>
            <button class="close-player" onclick="closePlayer()">إغلاق المشغل ✕</button>
        </div>
    </div>

    <div class="section-title" id="sectionTitle">🔥 أحدث مختارات إيجي ديد المميزة</div>
    
    <div class="movies-grid" id="moviesContainer"></div>

    <script>
        // قاعدة بيانات تمثل مكتبة مستوحاة من مصادر إيجي ديد وسيرفرات البث المباشر
        const egyDeadLibrary = [
            { id: 1, type: "movie", title: "Avatar: The Way of Water", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", embedUrl: "https://www.youtube.com/embed/d9MyW72ELq0" },
            { id: 2, type: "movie", title: "Interstellar", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", embedUrl: "https://www.youtube.com/embed/zSWdZVtXT7E" },
            { id: 3, type: "tv", title: "Breaking Bad", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg", embedUrl: "https://www.youtube.com/embed/HhesaQXLuRY" },
            { id: 4, type: "movie", title: "Avengers: Endgame", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg", embedUrl: "https://www.youtube.com/embed/TcMBFSGVi1c" },
            { id: 5, type: "movie", title: "The Batman", poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg", embedUrl: "https://www.youtube.com/embed/mqqft2x_Aa4" },
            { id: 6, type: "movie", title: "Spider-Man: No Way Home", poster: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg", embedUrl: "https://www.youtube.com/embed/JfVOs4VSpmA" },
            { id: 7, type: "movie", title: "John Wick: Chapter 4", poster: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", embedUrl: "https://www.youtube.com/embed/yjRHvt7uGCI" },
            { id: 8, type: "tv", title: "Game of Thrones", poster: "https://image.tmdb.org/t/p/w500/u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg", embedUrl: "https://www.youtube.com/embed/KPLWWIOCOOQ" }
        ];

        function initApp() {
            displayResults(egyDeadLibrary);
        }

        function displayResults(items) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            
            if(items.length === 0) {
                container.innerHTML = `<div class="loading">❌ لم يتم العثور على نتائج مطابقة.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMedia(item.title, item.embedUrl);
                card.innerHTML = `
                    <img src="${item.poster}" alt="${item.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title" title="${item.title}">${item.title}</div>
                        <div class="play-btn">▶ تشغيل داخلي</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playMedia(title, embedUrl) {
            const playerContainer = document.getElementById('playerContainer');
            const iframe = document.getElementById('videoIframe');
            const titleEl = document.getElementById('playerTitle');

            titleEl.innerText = `جارٍ تشغيل: ${title}`;
            iframe.src = embedUrl;
            playerContainer.style.display = 'block';

            // التمرير بسلاسة إلى أعلى الصفحة لعرض المشغل فوراً
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const playerContainer = document.getElementById('playerContainer');
            const iframe = document.getElementById('videoIframe');
            
            iframe.src = ''; // إيقاف الفيديو عند الإغلاق
            playerContainer.style.display = 'none';
        }

        function filterCategory(type) {
            document.querySelectorAll('.nav-links span').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            closePlayer();

            if(type === 'all') {
                document.getElementById('sectionTitle').innerText = "🔥 أحدث مختارات إيجي ديد المميزة";
                displayResults(egyDeadLibrary);
            } else {
                const filtered = egyDeadLibrary.filter(m => m.type === type);
                document.getElementById('sectionTitle').innerText = type === 'movie' ? "🎥 أفلام إيجي ديد" : "📺 مسلسلات إيجي ديد";
                displayResults(filtered);
            }
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('moviesContainer');
            
            if(!query) {
                displayResults(egyDeadLibrary);
                return;
            }

            const filtered = egyDeadLibrary.filter(m => m.title.toLowerCase().includes(query));
            document.getElementById('sectionTitle').innerText = `🔎 نتائج البحث عن: "${query}"`;
            displayResults(filtered);
        }

        initApp();
    </script>
</body>
</html>
