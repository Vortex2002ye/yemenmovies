<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemen Movies - منصة الأفلام والمسلسلات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0c0d12; color: #fff; padding: 20px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .nav-brand { font-size: 22px; font-weight: bold; color: #e50914; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; color: #aaa; }
        .nav-links span { cursor: pointer; transition: 0.2s; }
        .nav-links span:hover, .nav-links span.active { color: #fff; font-weight: bold; }
        
        .search-box { display: flex; gap: 8px; }
        input { width: 250px; padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #181920; color: #fff; font-size: 13px; outline: none; }
        input:focus { border-color: #e50914; }
        button { padding: 9px 18px; border-radius: 6px; border: none; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b20710; }

        .hero { position: relative; border-radius: 12px; overflow: hidden; margin-bottom: 30px; background: #1a1c23; display: flex; box-shadow: 0 8px 25px rgba(0,0,0,0.5); min-height: 280px; }
        .hero-img { width: 350px; object-fit: cover; background: #222; }
        .hero-content { padding: 25px; display: flex; flex-direction: column; justify-content: center; }
        .hero-badge { background: #e50914; color: #fff; padding: 4px 10px; font-size: 11px; border-radius: 4px; width: fit-content; margin-bottom: 10px; font-weight: bold; }
        .hero-title { font-size: 26px; font-weight: bold; margin-bottom: 10px; }
        .hero-desc { font-size: 13px; color: #b9bbbe; line-height: 1.6; margin-bottom: 20px; max-width: 600px; }
        .btn-watch { background: #e50914; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; width: fit-content; }
        .btn-watch:hover { background: #b20710; }

        .section-title { font-size: 18px; margin-bottom: 15px; color: #fff; border-right: 4px solid #e50914; padding-right: 10px; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .movie-card { background: #181920; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; background: #222; }
        .movie-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .movie-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .watch-btn { display: block; background: #e50914; color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 5px; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .watch-btn:hover { background: #b20710; }
        .loading { text-align: center; color: #8e9297; grid-column: 1 / -1; padding: 40px; font-size: 15px; }
        
        @media(max-width: 768px) {
            .hero { flex-direction: column; }
            .hero-img { width: 100%; height: 180px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">🎬 Yemen Movies</div>
        <div class="nav-links">
            <span class="active" onclick="filterCategory('all')">الرئيسية</span>
            <span onclick="filterCategory('movie')">أفلام</span>
            <span onclick="filterCategory('tv')">مسلسلات</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في المكتبة..." onkeydown="if(event.key === 'Enter') searchMovies()">
            <button onclick="searchMovies()">بحث</button>
        </div>
    </div>

    <div id="heroSection"></div>

    <div class="section-title" id="sectionTitle">🔥 مكتبة الأفلام والمسلسلات المميزة</div>
    
    <div class="movies-grid" id="moviesContainer"></div>

    <script>
        // مكتبة ضخمة محلية وآمنة 100% تعمل على المتصفح بدون أي حظر CORS أو تعليق
        const library = [
            { id: 1, type: "movie", title: "Avatar: The Way of Water", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", overview: "تتعرض عائلة سولي للكثير من المخاطر والتهجير للنجاة بحياتهم في عوالم باندورا المائية." },
            { id: 2, type: "movie", title: "Interstellar", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", overview: "رحلة عبر الثقوب الدودية للفضاء السحيق لإنقاذ البشرية وبحث موطن جديد." },
            { id: 3, type: "tv", title: "Breaking Bad", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/ggFHVNu6YYI5L9pCfOacjizRGt.jpg", overview: "مدرس كيمياء يصاب بمرض خطير فيتحول لصنع وتجارة المواد الممنوعة لتأمين مستقبل عائلته." },
            { id: 4, type: "movie", title: "Avengers: Endgame", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/or06FN3Dka5tukK1e9sl16pB3iy.jpg", overview: "المعركة الملحمية الأخيرة لفريق المنتقمون لعكس آثار كارثة ثانوس وإنقاذ الكون." },
            { id: 5, type: "movie", title: "The Batman", poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/74xTEgt7R36Fpooo50r9T25onhq.jpg", overview: "يكشف باتمان أسرار الفساد العميق في مدينة غوثام أثناء مطاردته لسفاح غامض." },
            { id: 6, type: "movie", title: "Spider-Man: No Way Home", poster: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg", overview: "انكشاف سر هوية بيتر باركر مما يدفعه لطلب المساعدة وتفتح أبواب الأكوان المتعددة." },
            { id: 7, type: "movie", title: "John Wick: Chapter 4", poster: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", overview: "يواصل جون ويك معاركه الضارية للوصول إلى الحرية المطلقة ومواجهة المجلس الأعلى." },
            { id: 8, type: "tv", title: "Game of Thrones", poster: "https://image.tmdb.org/t/p/w500/u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg", backdrop: "https://image.tmdb.org/t/p/w1280/u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg", overview: "صراعات دموية وملحمية بين العائلات النبيلة للسيطرة على العرش الحديدي في الممالك السبع." }
        ];

        function initApp() {
            setHero(library[0]);
            displayResults(library);
        }

        function setHero(item) {
            const watchLink = `https://www.moviz.land/?s=${encodeURIComponent(item.title)}`;
            document.getElementById('heroSection').innerHTML = `
                <div class="hero">
                    <img src="${item.backdrop}" class="hero-img" alt="${item.title}">
                    <div class="hero-content">
                        <div class="hero-badge">🔥 عمل مميز بارز</div>
                        <div class="hero-title">${item.title}</div>
                        <div class="hero-desc">${item.overview}</div>
                        <a href="${watchLink}" target="_blank" class="btn-watch">▶ مشاهدة العمل</a>
                    </div>
                </div>
            `;
        }

        function displayResults(items) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            
            if(items.length === 0) {
                container.innerHTML = `<div class="loading">❌ لم يتم العثور على نتائج مطابقة.</div>`;
                return;
            }

            items.forEach(movie => {
                const watchLink = `https://www.moviz.land/?s=${encodeURIComponent(movie.title)}`;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <a href="${watchLink}" target="_blank" class="watch-btn">مشاهدة</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(type) {
            document.querySelectorAll('.nav-links span').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if(type === 'all') {
                document.getElementById('sectionTitle').innerText = "🔥 مكتبة الأفلام والمسلسلات المميزة";
                displayResults(library);
            } else {
                const filtered = library.filter(m => m.type === type);
                document.getElementById('sectionTitle').innerText = type === 'movie' ? "🎥 قائمة الأفلام السينمائية" : "📺 قائمة المسلسلات التلفزيونية";
                displayResults(filtered);
            }
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('moviesContainer');
            
            if(!query) {
                displayResults(library);
                return;
            }

            const filtered = library.filter(m => m.title.toLowerCase().includes(query));
            document.getElementById('sectionTitle').innerText = `🔎 نتائج البحث عن: "${query}"`;
            
            if(filtered.length > 0) {
                setHero(filtered[0]);
                displayResults(filtered);
            } else {
                container.innerHTML = `
                    <div class="loading" style="grid-column: 1 / -1;">
                        <p style="margin-bottom: 12px;">🔍 هل تبحث عن "${query}" غير موجود بالقائمة؟ انقر للانتقال للبحث المباشر:</p>
                        <a href="https://www.moviz.land/?s=${encodeURIComponent(query)}" target="_blank" class="watch-btn" style="display: inline-block; padding: 10px 20px;">بحث مباشر في MovizLand 🎬</a>
                    </div>
                `;
            }
        }

        initApp();
    </script>
</body>
</html>
