<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemen Movies Activity</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f1015; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #5865F2; margin-bottom: 10px; }
        p { color: #b9bbbe; font-size: 14px; }
        .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        input { width: 320px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #202225; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #5865F2; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #5865F2; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4752C4; }
        
        .section-title { font-size: 18px; margin-bottom: 15px; color: #dcddde; border-right: 4px solid #5865F2; padding-right: 10px; }
        
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .movie-card { background: #2f3136; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; background: #202225; }
        .movie-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .movie-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #fff; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .watch-btn { display: block; background: #eb459e; color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 5px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .watch-btn:hover { background: #d03588; }
        .loading { text-align: center; color: #8e9297; grid-column: 1 / -1; padding: 30px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Yemen Movies Activity</h1>
        <p>اختر فيلمك أو مسلسلك المفضّل وشاهده مباشرة على موفيز لاند!</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." onkeydown="if(event.key === 'Enter') searchMovies()">
        <button onclick="searchMovies()">بحث</button>
    </div>

    <div class="section-title" id="sectionTitle">🔥 قائمة الأفلام والمسلسلات المميزة</div>
    
    <div class="movies-grid" id="moviesContainer">
        <!-- ستعرض هنا مباشرة -->
    </div>

    <script>
        // مكتبة ضخمة ومنظمة لأشهر الأفلام والمسلسلات مع بوستراتها الأصلية
        const moviesList = [
            { title: "Avatar: The Way of Water", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg" },
            { title: "Interstellar", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
            { title: "Breaking Bad", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
            { title: "Avengers: Endgame", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
            { title: "The Batman", poster: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" },
            { title: "Spider-Man: No Way Home", poster: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg" },
            { title: "John Wick: Chapter 4", poster: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg" },
            { title: "Inception", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg" },
            { title: "Game of Thrones", poster: "https://image.tmdb.org/t/p/w500/u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg" },
            { title: "Attack on Titan", poster: "https://image.tmdb.org/t/p/w500/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg" },
            { title: "Joker", poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg" },
            { title: "The Witcher", poster: "https://image.tmdb.org/t/p/w500/7vjaCdMw15FEbXyLQTVa04URsPm.jpg" }
        ];

        function loadAllMovies() {
            displayResults(moviesList);
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('moviesContainer');
            
            if (!query) {
                document.getElementById('sectionTitle').innerText = "🔥 قائمة الأفلام والمسلسلات المميزة";
                displayResults(moviesList);
                return;
            }

            const filtered = moviesList.filter(m => m.title.toLowerCase().includes(query));
            
            if (filtered.length > 0) {
                document.getElementById('sectionTitle').innerText = `🔎 نتائج البحث عن: "${query}"`;
                displayResults(filtered);
            } else {
                // إذا لم يكن في القائمة المباشرة، يتيح له البحث عنه بضغطة زر مباشرة في موفيز لاند
                container.innerHTML = `
                    <div class="loading" style="grid-column: 1 / -1;">
                        <p style="margin-bottom: 15px; font-size: 15px;">🔍 هل تبحث عن فيلم أو مسلسل غير موجود بالقائمة؟ انقر بالأسفل لفتحه وبحثه مباشرة على موفيز لاند:</p>
                        <a href="https://www.moviz.land/?s=${encodeURIComponent(query)}" target="_blank" class="watch-btn" style="display: inline-block; padding: 12px 25px; font-size: 14px;">الانتقال للبحث في MovizLand 🎬</a>
                    </div>
                `;
            }
        }

        function displayResults(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            
            movies.forEach(movie => {
                const movizLink = `https://www.moviz.land/?s=${encodeURIComponent(movie.title)}`;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <a href="${movizLink}" target="_blank" class="watch-btn">مشاهدة على MovizLand</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تشغيل مباشر
        loadAllMovies();
    </script>
</body>
</html>
